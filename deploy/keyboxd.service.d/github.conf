# Lets Key-Box reach GitHub's API, and nothing else on the internet.
#
# These are the "api" ranges from https://api.github.com/meta as of
# 11 October 2026. GitHub changes them now and then. When that happens
# Key-Box answers "github-unreachable"; refresh the list and run
# `systemctl daemon-reload && systemctl restart keyboxd`.
[Service]
IPAddressAllow=192.30.252.0/22 185.199.108.0/22 140.82.112.0/20 143.55.64.0/20
IPAddressAllow=2a0a:a440::/29 2606:50c0::/32
IPAddressAllow=20.201.28.148 20.205.243.168 20.87.245.6 4.237.22.34 4.228.31.149
IPAddressAllow=20.207.73.85 20.27.177.116 20.200.245.245 20.175.192.149 20.233.83.146
IPAddressAllow=20.29.134.17 20.199.39.228 20.217.135.0 4.225.11.201 4.208.26.200
IPAddressAllow=20.26.156.210 172.182.252.137 4.249.131.166 48.202.248.39 48.204.201.2
