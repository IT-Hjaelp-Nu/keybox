[workspace]
resolver = "3"
members = [
    "crates/keybox-api",
    "crates/keybox-core",
    "crates/keybox-log",
    "crates/keybox-policy",
    "crates/keybox-webauthn",
    "crates/keyboxd",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
