[package]
name = "keybox-api"
version = "0.1.0"
description = "Key-Box agent API: message format, parser and dispatch. No network."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
keybox-core = { path = "../keybox-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
