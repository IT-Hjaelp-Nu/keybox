[package]
name = "keybox-webauthn"
version = "0.1.0"
description = "Key-Box passkey verification: a narrow WebAuthn relying party on ring."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
