[package]
name = "keyboxd"
version = "0.1.0"
description = "The Key-Box daemon."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
keybox-api = { path = "../keybox-api" }
keybox-core = { path = "../keybox-core" }
keybox-log = { path = "../keybox-log" }
keybox-policy = { path = "../keybox-policy" }
keybox-webauthn = { path = "../keybox-webauthn" }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "std", "ed25519"] }
tokio = { version = "1.53.2", features = ["rt", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
webpki-roots = "1.0.9"
zeroize = "1.9.1"

[dev-dependencies]
