# cargo deny check

[graph]
all-features = true
# Key-Box runs on Linux only. Without this, Windows-only crates that are
# never compiled here are checked too.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
# CDLA-Permissive-2.0 covers the list of root certificates in webpki-roots.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

# Our own crates are not published and carry no open-source licence.
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", reason = "TLS and crypto go through rustls and ring" },
    { crate = "openssl-sys", reason = "TLS and crypto go through rustls and ring" },
    { crate = "native-tls", reason = "TLS and crypto go through rustls and ring" },
    { crate = "rsa", reason = "RUSTSEC-2023-0071 has no fix; Key-Box signs RSA with ring and accepts only Ed25519 SSH keys" },
]
# Two versions of a build-time code generator, never part of the program:
# curve25519-dalek's derive macro still uses syn 2.
skip = [{ crate = "syn@2", reason = "proc-macro dependency of curve25519-dalek-derive" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
